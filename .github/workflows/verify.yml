name: Verify NovaFrame

on:
  push:
    branches:
      - main
      - real-ltx-video-worker
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install web/test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run backend and worker unit tests
        run: python -m pytest -q

      - name: Validate Python syntax
        run: python -m compileall -q api app.py tests worker

      - name: Ensure paid Higgsfield runtime is gone
        run: |
          if grep -R "api.higgsfield.ai" api worker requirements.txt; then
            echo "Paid Higgsfield runtime reference found"
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate frontend JavaScript
        run: node --check public/app.js
